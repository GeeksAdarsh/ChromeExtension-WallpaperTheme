<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>New Tab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&family=Varela+Round&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="veil" aria-hidden="true"></div>

  <main>
    <header class="lock">
      <p class="hello" data-quiet>
        <span id="greet">Good evening</span>,
        <button type="button" id="who" title="Click to change your name">Adarsh</button>
      </p>
      <h1 class="clock" id="clock">
        <span id="hm"><span id="hour">04</span><span class="dots" aria-hidden="true"><i></i><i></i></span><span id="minute">05</span></span><span id="ampm">PM</span>
      </h1>
      <p class="date" id="date" data-quiet>Monday, 26 October</p>
      <div class="floater" id="weather-wrap" data-quiet hidden>
        <button type="button" id="weather" class="quiet-line" title="Drag anywhere, or click to change city"><span id="weather-label"></span><span id="weather-mark" class="sky-mark" hidden></span></button>
        <button type="button" id="weather-hide" class="pill-hide" aria-label="Hide city">×</button>
      </div>
      <div class="floater card" id="note-wrap" data-quiet hidden>
        <div class="card-bar">
          <span class="card-title">Notes</span>
          <button type="button" id="note-hide" class="word-hide">Hide</button>
        </div>
        <div class="day-row">
          <div class="day-strip" id="day-strip" aria-label="Days and lists"></div>
          <button type="button" id="list-add" class="day-add" aria-label="New list" title="New list">+</button>
        </div>
        <div class="count-row" id="count-row">
          <span class="count-label">Applied jobs <span class="count-week" id="count-week"></span></span>
          <span class="count-tools">
            <button type="button" id="count-down" class="count-btn">−</button>
            <span id="count-value" class="count-value" aria-live="polite">0</span>
            <button type="button" id="count-up" class="count-btn">+</button>
          </span>
        </div>
        <p class="stat-line" id="stat-line"></p>
        <ul class="points" id="note-list"></ul>
        <button type="button" id="copy-open" class="word-hide copy-open" hidden>Copy unticked to Today</button>
        <form class="note-form" id="note-form">
          <input id="note-input" type="text" placeholder="Add a point or paste a link" maxlength="600" autocomplete="off" />
        </form>
        <span class="card-size size-e" data-size="e" aria-hidden="true"></span>
        <span class="card-size size-s" data-size="s" aria-hidden="true"></span>
        <span class="card-size size-se" data-size="se" title="Drag to resize, double-click to reset" aria-hidden="true"></span>
      </div>
    </header>

    <form class="search" id="search" role="search">
      <label class="sr" for="q">Search</label>
      <button class="go" type="submit" aria-label="Search">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="6.25" />
          <path d="M16 16.5L20 20.5" />
        </svg>
      </button>
      <input id="q" name="q" type="search" placeholder="Search" autocomplete="off" spellcheck="false" />
    </form>

    <section class="dock-wrap" id="dock-wrap">
      <div class="modes">
        <button type="button" id="focus-toggle" class="bookmark-toggle" aria-pressed="false">Focus</button>
        <button type="button" id="study-toggle" class="bookmark-toggle" aria-expanded="false">Study</button>
        <button type="button" id="city-toggle" class="bookmark-toggle">City</button>
        <button type="button" id="note-toggle" class="bookmark-toggle">Note</button>
        <button type="button" id="bookmark-toggle" class="bookmark-toggle" aria-expanded="true">Hide</button>
      </div>
      <div class="study-pick" id="study-pick" hidden>
        <button type="button" data-minutes="25">25 min</button>
        <button type="button" data-minutes="45">45 min</button>
        <button type="button" data-minutes="60">1 hr</button>
        <button type="button" data-minutes="90">1.5 hr</button>
        <input id="study-custom" type="number" min="1" max="240" placeholder="min" aria-label="Custom minutes" />
      </div>
      <div id="bookmark-panel">
        <nav class="dock" id="dock" aria-label="Bookmarks"></nav>
        <form class="editor" id="editor" hidden>
          <input id="bm-name" type="text" placeholder="Name" maxlength="24" autocomplete="off" />
          <input id="bm-url" type="text" placeholder="mail.google.com" autocomplete="off" spellcheck="false" />
          <button type="submit">Add</button>
        </form>
      </div>
    </section>
  </main>

  <button type="button" id="wall-next" class="wall-next" aria-label="Next wallpaper">
    <svg viewBox="0 0 40 34" aria-hidden="true">
      <path d="M4 22C16 22 18 7 30 7" />
      <path class="head" d="M26 3.2 36 7 26 10.8z" />
      <path d="M4 12C16 12 18 27 30 27" />
      <path class="head" d="M26 23.2 36 27 26 30.8z" />
    </svg>
  </button>
  <button type="button" id="wall-auto" class="wall-auto">Auto off</button>

  <script src="app.js"></script>
</body>
</html>
